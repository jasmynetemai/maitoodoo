name: Build iOS IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Build Xcode Project
        run: |
          cd ios/App
          xcodebuild build -workspace App.xcworkspace -scheme App -destination generic/platform=iOS CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED=NO -configuration Release
          mkdir Payload
          mv build/Release-iphoneos/App.app Payload/
          zip -r AcademicTracker.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AcademicTracker-IPA
          path: ios/App/AcademicTracker.ipa
