<div class="sub h">Semester & countdown</div><label>Semester name<input type="text" data-semf="name" value="${esc(S.sem.name)}"></label>${sm('start','Start date')}${sm('end','End date')}${sm('mid','Midsem date')}${sm('fin','Finals date')}`)+
G('c','Courses',`${S.courses.map(c=>`<div class="row" data-cedit="${c.id}"><span class="dot" style="background:${c.color};width:14px;height:14px;margin:0"></span><div class="grow"><div class="t">${esc((c.icon?c.icon+' ':'')+c.name)}</div></div><span class="due">Edit</span></div>`).join('')||'<div class="empty">No courses yet</div>'}<button class="btn p" data-cnew="1" style="width:100%;margin:4px 0 12px">Add course</button><div class="m" style="margin-bottom:12px">Tap a course to rename it, change its colour or icon, or drop it.</div>`)+
G('a','Assignments',`<label>Default status for new assignments<select data-pref="defSt"><option value="start" ${p.defSt!='prog'?'selected':''}>To start</option><option value="prog" ${p.defSt=='prog'?'selected':''}>In progress</option></select></label>`)+
G('k','Calendar',`<label>Week starts on<select data-pref="weekStart"><option value="0" ${p.weekStart==0?'selected':''}>Sunday</option><option value="1" ${p.weekStart==1?'selected':''}>Monday</option></select></label>`)+
G('g','General',`<div class="sub h">Appearance</div><div class="seg">${[['system','System'],['light','Light'],['dark','Dark']].map(m=>`<button class="${p.theme==m[0]?'on':''}" data-mode="${m[0]}">${m[1]}</button>`).join('')}</div>
<div class="sub" style="margin-bottom:8px">Theme colour</div><div class="sw">${sw.map(c=>`<button data-accent="${c}" style="background:${c}" class="${p.accent==c?'on':''}"></button>`).join('')}</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0"><span>24-hour clock</span><button class="btn ${p.h24?'p':''}" data-h24="1">${p.h24?'On':'Off'}</button></div>
<div class="sub h" style="margin-top:16px">Notifications</div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px"><div><div class="t">Class & reminder alerts</div><div class="m">${msg}</div></div><button class="btn ${p.notif?'p':''}" data-notif="1">${p.notif?'On':'Off'}</button></div>
<label>Today's classes summary at<input type="time" ${pr('clsTime',p.clsTime)}></label><label>Reminders alert at<input type="time" ${pr('taskTime',p.taskTime)}></label>
<label>Remind before each class<select data-pref="lead">${[0,5,10,15,30,60].map(m=>`<option value="${m}" ${p.lead==m?'selected':''}>${m?m+' minutes':'Off'}</option>`).join('')}</select></label><button class="btn" data-test="1">Send test notification</button>
<div class="m" style="margin:8px 0">Alerts fire while the app is open or in the background. Mobile browsers can't wake a fully closed web page.</div>
<div class="sub h" style="margin-top:16px">Data</div><div class="btns" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn" data-clear="1">Clear completed</button><button class="btn" data-backup="1">Copy backup</button><button class="btn" data-restore="1">Restore</button><button class="btn d" data-reset="1">Reset all</button></div>
<textarea id="bk" style="display:none" placeholder="Paste a backup here, then tap Restore again"></textarea><div class="m" style="margin:8px 0">Backups include text only. Journal photos and videos stay on this device.</div>`)+
`<div class="btns"><button class="btn p" data-close="1">Done</button></div>`);
$('#sheet').dataset.k='set';$('#sheet').scrollTop=y}
function cropper(kind,src){const bg=kind=='bg',W=bg?300:240,H=bg?150:240,OW=bg?900:360,OH=bg?450:360,im=new Image();
im.onload=()=>{const nw=im.width,nh=im.height,s0=Math.max(W/nw,H/nh);let z=1,ox=(W-nw*s0)/2,oy=(H-nh*s0)/2;
open_(`<h3>${bg?'Adjust background':'Adjust photo'}</h3><div id="cf" style="position:relative;width:${W}px;height:${H}px;margin:0 auto 14px;overflow:hidden;border-radius:${bg?'16px':'50%'};touch-action:none;background:#000"><img id="ci" src="${src}" draggable="false" style="position:absolute;max-width:none;user-select:none;pointer-events:none"></div>
<label>Zoom<input type="range" id="cz" min="1" max="3" step="0.01" value="1" style="padding:0"></label><div class="sub">Drag the photo to reposition it</div><div class="btns"><button class="btn" data-ccancel="1">Cancel</button><button class="btn p" id="csave">Save</button></div>`);
const ci=$('#ci'),cf=$('#cf'),put=()=>{const sc=s0*z,w=nw*sc,h=nh*sc;ox=Math.min(0,Math.max(W-w,ox));oy=Math.min(0,Math.max(H-h,oy));Object.assign(ci.style,{width:w+'px',height:h+'px',left:ox+'px',top:oy+'px'})};put();let d=null;
cf.onpointerdown=e=>{d={x:e.clientX,y:e.clientY,ox,oy};cf.setPointerCapture(e.pointerId)};cf.onpointermove=e=>{if(!d)return;ox=d.ox+e.clientX-d.x;oy=d.oy+e.clientY-d.y;put()};cf.onpointerup=()=>d=null;
$('#cz').oninput=e=>{const cx=(W/2-ox)/(s0*z),cy=(H/2-oy)/(s0*z);z=+e.target.value;ox=W/2-cx*s0*z;oy=H/2-cy*s0*z;put()};
$('#csave').onclick=()=>{const sc=s0*z,c=document.createElement('canvas');c.width=OW;c.height=OH;c.getContext('2d').drawImage(im,-ox/sc,-oy/sc,W/sc,H/sc,0,0,OW,OH);S.prefs[kind]=c.toDataURL('image/jpeg',.85);save();close();render();settingsForm()}};im.src=src}
const idb=new Promise((res,rej)=>{try{const q=indexedDB.open('acad-media',1);q.onupgradeneeded=()=>q.result.createObjectStore('m');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});
const tx=(m,f)=>idb.then(d=>new Promise((res,rej)=>{const q=f(d.transaction('m',m).objectStore('m'));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
const mPut=(k,v)=>tx('readwrite',s=>s.put(v,k)),mGet=k=>tx('readonly',s=>s.get(k)),mDel=k=>tx('readwrite',s=>s.delete(k));
function drawM(){const d=$('#jm');if(d)d.innerHTML=jf.media.map((m,k)=>`<div class="jmi">${m.type=='video'?`<video src="${m.url}" muted playsinline></video>`:`<img src="${m.url}">`}<button data-jrm="${k}">✕</button></div>`).join('')}
function journalForm(id){const e=S.journal.find(x=>x.id==id)||{title:'',date:today(),text:'',media:[]};jf={id,media:[],del:[]};
open_(`<h3>${id?'Edit':'New'} entry</h3><label>Title<input id="j-t" value="${esc(e.title)}"></label><label>Date<input type="date" id="j-d" value="${e.date}"></label>
<label>Thoughts & updates<textarea id="j-x" style="height:130px;font-size:16px;font-family:inherit">${esc(e.text)}</textarea></label>
<label class="up btn">Add photos / videos<input type="file" accept="image/*,video/*" multiple data-jfile="1" style="display:none"></label><div id="jm" class="jm"></div>
<div class="btns"><button class="btn" data-close="1">Cancel</button><button class="btn p" data-jsave="${id||''}">Save</button></div>`);
e.media.forEach(m=>mGet(m.id).then(b=>{if(b){jf.media.push({id:m.id,type:m.type,blob:b,url:URL.createObjectURL(b),old:1});drawM()}}).catch(()=>{}))}
function jview(id){const e=S.journal.find(x=>x.id==id);
open_(`<div class="m">${fd(e.date)}</div><h3 style="margin:2px 0 10px">${esc(e.title)}</h3><div style="white-space:pre-wrap">${esc(e.text)}</div><div style="margin-top:12px;display:grid;gap:8px">${e.media.map((m,k)=>`<div id="jv${k}"></div>`).join('')}</div>
<div class="btns"><button class="btn d" data-jdel="${id}">Delete</button><button class="btn" data-close="1">Close</button><button class="btn p" data-jedit="${id}">Edit</button></div>`);
e.media.forEach((m,k)=>mGet(m.id).then(b=>{const d=$('#jv'+k);if(!b||!d)return;const u=URL.createObjectURL(b);d.innerHTML=m.type=='video'?`<video src="${u}" controls playsinline style="width:100%;border-radius:12px"></video>`:`<img src="${u}" style="width:100%;border-radius:12px">`}).catch(()=>{}))}
const done=()=>{save();close();render();if(retSet){retSet=false;settingsForm()}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),6000)}
function notify(t,b){toast(t+': '+b);if('Notification' in window&&Notification.permission=='granted'){try{new Notification(t,{body:b})}catch(e){}}}
function tick(){if(!S.prefs.notif)return;const n=new Date(),td=today(),p=S.prefs,hm=pad(n.getHours())+':'+pad(n.getMinutes()),nm=n.getHours()*60+n.getMinutes();
Object.keys(S.sent).forEach(k=>{if(!k.startsWith(td))delete S.sent[k]});
const fire=(k,t,b)=>{if(S.sent[k])return;S.sent[k]=1;save();notify(t,b)};const cl=classesOn(n.getDay());
if(cl.length&&hm>=p.clsTime)fire(td+'cls',"Today's classes",cl.map(x=>ft(x.t)+' '+x.c.name).join(' · '));
if(p.lead>0)cl.forEach(x=>{const st=mins(x.t);if(nm>=st-p.lead&&nm<st)fire(td+x.c.id+x.t,'Class in '+(st-nm)+' min',x.c.name+' at '+ft(x.t))});
const pend=S.items.filter(i=>!i.done&&(i.type=='task'||i.type=='reminder'));
if(pend.length&&hm>=p.taskTime)fire(td+'tsk',pend.length+' reminders',pend.slice(0,3).map(i=>i.title).join(', ')+(pend.length>3?'…':''))}
function img(f,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(f)}
const refresh=()=>{render();if($('#sheet').dataset.k=='set')settingsForm()};
document.addEventListener('click',e=>{const t=e.target,g=a=>t.closest('['+a+']');let x;
if(g('data-close')||t.id=='modal'){close();if(retSet){retSet=false;settingsForm()}return}
if(x=g('data-tab')){tab=x.dataset.tab;cid=null;jv=false;render();window.scrollTo(0,0);return}
if(x=g('data-tog')){const i=S.items.find(i=>i.id==x.dataset.tog);i.done=!i.done;save();render();e.stopPropagation();return}
if(x=g('data-st')){const i=S.items.find(i=>i.id==x.dataset.st);i.st=i.st=='prog'?'start':'prog';save();render();return}
if(x=g('data-edit')){itemForm(x.dataset.edit);return}
if(x=g('data-day')){sel=x.dataset.day;render();return}
if(x=g('data-mo')){cur.setMonth(cur.getMonth()+ +x.dataset.mo);render();return}
if(x=g('data-course')){cid=x.dataset.course;render();window.scrollTo(0,0);return}
if(g('data-back')){cid=null;render();return}
if(x=g('data-cedit')){retSet=true;courseForm(x.dataset.cedit);return}
if(x=g('data-addsess')){sessForm(x.dataset.addsess,'');return}
if(x=g('data-sess')){const[a,b]=x.dataset.sess.split(':');sessForm(a,+b);return}
if(x=g('data-additem')){const[a,b]=x.dataset.additem.split(':');itemForm('',a,b);return}
if(g('data-settings')){settingsForm();return}
if(g('data-cnew')){retSet=true;courseForm('');return}
if(x=g('data-cpick')){$('#c-color').value=x.dataset.cpick;document.querySelectorAll('#csw button').forEach(b=>b.classList.toggle('on',b==x));return}
if(x=g('data-adj')){const k=x.dataset.adj;mGet('orig-'+k).then(u=>cropper(k,u||S.prefs[k])).catch(()=>cropper(k,S.prefs[k]));return}
if(g('data-ccancel')){close();settingsForm();return}
if(g('data-journal')){jv=true;render();window.scrollTo(0,0);return}
if(g('data-jback')){jv=false;render();return}
if(g('data-jnew')){journalForm('');return}
if(x=g('data-jview')){jview(x.dataset.jview);return}
if(x=g('data-jedit')){journalForm(x.dataset.jedit);return}
if(x=g('data-jrm')){const m=jf.media.splice(+x.dataset.jrm,1)[0];if(m.old)jf.del.push(m.id);drawM();return}
if(x=g('data-jdel')){if(!x.dataset.c){x.dataset.c=1;x.textContent='Tap again to confirm';return}
const e=S.journal.find(v=>v.id==x.dataset.jdel);e.media.forEach(m=>mDel(m.id).catch(()=>{}));S.journal=S.journal.filter(v=>v!=e);save();close();render();return}
if(x=g('data-jsave')){const title=$('#j-t').value.trim();if(!title){$('#j-t').focus();return}
const id=x.dataset.jsave||uid(),o={title,date:$('#j-d').value||today(),text:$('#j-x').value,media:jf.media.map(m=>({id:m.id,type:m.type}))};
Promise.all([...jf.media.filter(m=>!m.old).map(m=>mPut(m.id,m.blob)),...jf.del.map(mDel)]).then(()=>{const e=S.journal.find(v=>v.id==id);if(e)Object.assign(e,o);else S.journal.push({id,ts:Date.now(),...o});save();close();render()}).catch(()=>toast('Media could not be saved on this device'));return}
if(x=g('data-mode')){S.prefs.theme=x.dataset.mode;save();applyTheme();settingsForm();return}
if(x=g('data-accent')){S.prefs.accent=x.dataset.accent;save();applyTheme();refresh();return}
if(g('data-h24')){S.prefs.h24=!S.prefs.h24;save();refresh();return}
if(x=g('data-rm')){S.prefs[x.dataset.rm]='';save();refresh();return}
if(g('data-notif')){S.prefs.notif=!S.prefs.notif;save();
if(S.prefs.notif&&'Notification' in window&&Notification.permission=='default'){try{Notification.requestPermission().then(()=>{refresh();tick()})}catch(er){}}
refresh();tick();return}
if(g('data-test')){notify('Test reminder','Notifications are working ✅');return}
if(g('data-clear')){S.items=S.items.filter(i=>!i.done);save();render();toast('Cleared completed items');return}
if(g('data-backup')){const j=JSON.stringify(S),b=$('#bk');const sh=()=>{b.style.display='block';b.value=j;b.select()};
try{navigator.clipboard.writeText(j).then(()=>toast('Backup copied to clipboard'),sh)}catch(er){sh()}return}
if(g('data-restore')){const b=$('#bk');if(b.style.display=='none'){b.style.display='block';b.value='';return}
try{const o=JSON.parse(b.value);if(!o.courses||!o.items)throw 0;S=o;fixS();save();applyTheme();render();settingsForm();toast('Backup restored')}catch(er){toast('That backup could not be read')}return}
if(x=g('data-reset')){if(!x.dataset.c){x.dataset.c=1;x.textContent='Tap again to confirm';return}
S={sem:seed().sem,courses:[],items:[]};fixS();save();applyTheme();cid=null;render();close();toast('All data reset');return}
if(x=g('data-del')){const id=x.dataset.del;
if(id.startsWith('sess:')){const[,a,b]=id.split(':');course(a).sessions.splice(+b,1)}
else if(S.courses.some(c=>c.id==id)){S.courses=S.courses.filter(c=>c.id!=id);S.items.forEach(i=>{if(i.course==id)i.course=''});cid=null}else S.items=S.items.filter(i=>i.id!=id);
done();return}
if(x=g('data-ok')){const[k,id,ix]=x.dataset.ok.split(':');
if(k=='item'){const title=$('#f-title').value.trim();if(!title){$('#f-title').focus();return}
const o={type:$('#f-type').value,title,course:$('#f-course').value,due:$('#f-due').value,start:$('#f-start').value,st:$('#f-st').value};
if(id)Object.assign(S.items.find(i=>i.id==id),o);else S.items.push({id:uid(),done:false,...o})}
else if(k=='course'){const name=$('#c-name').value.trim();if(!name){$('#c-name').focus();return}
const o={name,code:$('#c-code').value.trim().toUpperCase(),icon:$('#c-icon').value.trim(),color:$('#c-color').value};if(id)Object.assign(course(id),o);else S.courses.push({id:uid(),sessions:[],...o})}
else if(k=='sess'){const o={k:$('#s-k').value,d:+$('#s-d').value,t:$('#s-t').value||'09:00'};o.e=$('#s-e').value;if(!o.e||o.e<=o.t)o.e=plusH(o.t);const c=course(id);if(ix==='')c.sessions.push(o);else c.sessions[+ix]=o}
done()}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
if(t.id=='f-type'){$('#f-stw').style.display=['assignment','project'].includes(t.value)?'block':'none';return}
if(d.img){const f=t.files[0];if(!f)return;img(f,1400,u=>{mPut('orig-'+d.img,u).catch(()=>{});cropper(d.img,u)});t.value='';return}
if(d.jfile){[...t.files].forEach(f=>jf.media.push({id:uid(),type:f.type.startsWith('video')?'video':'image',blob:f,url:URL.createObjectURL(f)}));drawM();t.value='';return}
if(d.semf){S.sem[d.semf]=t.value;save();render();return}
const k=d.pref;if(!k)return;S.prefs[k]=['lead','weekStart','gpaScale'].includes(k)?+t.value:t.value;save();render()});
$('#fab').onclick=()=>itemForm('',tab=='work'?'assignment':'task');
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.g){d.open?og.add(d.dataset.g):og.delete(d.dataset.g)}},true);
setInterval(tick,30000);document.addEventListener('visibilitychange',tick);
applyTheme();render();tick();
</script></body></html>
